name: Integration tests with Newman

on:
  pull_request:
    branches:
      - main
      - develop


jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x mvnw

      - run: ./mvnw clean package -DskipTests

      - run: |
          echo "MYSQL_ROOT_PASSWORD=root" >> .env
          echo "MYSQL_DATABASE=eventia" >> .env
          echo "MYSQL_USER=user" >> .env
          echo "MYSQL_PASSWORD=pass" >> .env
          echo "DB_USER=user" >> .env
          echo "DB_PASSWORD=pass" >> .env
          echo "PROFILES=prod" >> .env

      - run: docker build -t eventia-api .

      - run: docker compose up -d

      - run: sleep 40

      - run: npm install -g newman

      - run: newman run Postman/UsuariosV1-test.postman_collection.json -e Postman/local.postman_environment.json