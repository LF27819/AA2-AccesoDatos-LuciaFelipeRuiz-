name: Postman Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.3.2
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eventia
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Arrancar API
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev &
          sleep 40

      - name: Comprobar que la API responde
        run: curl --fail http://localhost:8080/api/v1/usuarios/999999 || true

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar colección de Postman
        run: newman run Postman/UsuariosV1-test.postman_collection.json -e Postman/local.postman_environment.json