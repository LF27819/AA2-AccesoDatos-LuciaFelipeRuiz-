name: Postman Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.3.2
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eventia
          MYSQL_USER: user
          MYSQL_PASSWORD: pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar proyecto
        run: ./mvnw clean package -DskipTests

      - name: Arrancar API
        run: |
          nohup ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev > app.log 2>&1 &

      - name: Esperar a que la API arranque
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:8080/api/v1/usuarios/999999 > /dev/null; then
              echo "API arrancada"
              exit 0
            fi
            echo "Esperando API..."
            sleep 2
          done
          echo "La API no arrancó"
          cat app.log
          exit 1

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar colección de Postman
        run: newman run Postman/UsuariosV1-test.postman_collection.json -e Postman/local.postman_environment.json

      - name: Mostrar logs si falla
        if: failure()
        run: cat app.log