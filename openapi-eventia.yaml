        '200':
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema: *id001
              examples:
                ejemplo1:
                  summary: Usuario v2 con nickname
                  value:
                    id: 1
                    nombre: Lucia
                    apellidos: Perez Gomez
                    email: lucia@gmail.com
                    password: secreto12
                    telefono: '600123123'
                    activo: true
                    fechaNacimiento: '1999-05-12'
                    eventosAsistidos: 4
                    rol: USER
                    saldoCuenta: 35.5
                    nickname: lucy
                ejemplo2:
                  summary: Administrador v2 con nickname
                  value:
                    id: 2
                    nombre: Carlos
                    apellidos: Lopez Martinez
                    email: carlos@gmail.com
                    password: clave5678
                    telefono: '611222333'
                    activo: true
                    fechaNacimiento: '1990-08-20'
                    eventosAsistidos: 10
                    rol: ADMIN
                    saldoCuenta: 120.0
                    nickname: carlosAdmin
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Usuarios
      summary: Modificar usuario (v2)
      description: Sustituye completamente los datos de un usuario existente. En la versión 2 nickname es obligatorio.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
            examples:
              ejemplo1:
                summary: Actualizar nickname y rol
                value:
                  nombre: Lucia
                  apellidos: Perez Gomez
                  email: lucia@gmail.com
                  password: secreto12
                  telefono: '600123123'
                  activo: true
                  fechaNacimiento: '1999-05-12'
                  eventosAsistidos: 4
                  rol: ADMIN
                  saldoCuenta: 35.5
                  nickname: lucy_admin
              ejemplo2:
                summary: Actualizar saldo y nickname
                value:
                  nombre: Carlos
                  apellidos: Lopez Martinez
                  email: carlos@gmail.com
                  password: clave5678
                  telefono: '611222333'
                  activo: true
                  fechaNacimiento: '1990-08-20'
                  eventosAsistidos: 11
                  rol: ADMIN
                  saldoCuenta: 200.0
