    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario (v2)
      description: Elimina un usuario y devuelve un mensaje de confirmación.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUsuarioResponseV2'
              examples:
                ejemplo1:
                  summary: Mensaje de confirmación
                  value:
                    message: Usuario eliminado correctamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /artistas:
    get:
      tags:
        - Artistas
      summary: Obtener todos los artistas
      description: Filtra opcionalmente por nombreArtistico, generoMusical y activo.
      parameters:
        - name: nombreArtistico
          in: query
          required: false
          description: Filtra por nombre artístico.
          schema:
            type: string
          example: Aitana
        - name: generoMusical
          in: query
          required: false
          description: Filtra por género musical.
          schema:
            type: string
          example: Pop
        - name: activo
          in: query
          required: false
          description: Filtra por si el artista está activo.
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Lista de artistas obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artista'
              examples:
                sinFiltros:
                  summary: Consulta sin filtros
                  value:
                    - id: 1
                      nombreArtistico: Aitana
                      nombreReal: Aitana Ocaña Morales
                      generoMusical: Pop
                      fechaNacimiento: '1999-06-27'
                      activo: true
                      cache: 5000.0
                      eventosRealizados: 20
                    - id: 2
                      nombreArtistico: Bad Bunny
                      nombreReal: Benito Antonio Martinez
                      generoMusical: Reggaeton
                      fechaNacimiento: '1994-03-10'
                      activo: true
                      cache: 15000.0
                      eventosRealizados: 50
                filtradoPorGenero:
                  summary: Consulta filtrada por género Pop
                  value:
                    - id: 1
                      nombreArtistico: Aitana
                      nombreReal: Aitana Ocaña Morales
                      generoMusical: Pop
                      fechaNacimiento: '1999-06-27'
                      activo: true
                      cache: 5000.0
                      eventosRealizados: 20
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Artistas
      summary: Crear artista
      description: Registra un nuevo artista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Artista'
            examples:
              ejemplo1:
                summary: Artista pop
                value:
                  nombreArtistico: Aitana
                  nombreReal: Aitana Ocaña Morales
                  generoMusical: Pop
                  fechaNacimiento: '1999-06-27'
                  activo: true
                  cache: 5000.0
                  eventosRealizados: 20
              ejemplo2:
                summary: Artista reggaeton
                value:
                  nombreArtistico: Bad Bunny
                  nombreReal: Benito Antonio Martinez
                  generoMusical: Reggaeton
                  fechaNacimiento: '1994-03-10'
                  activo: true
                  cache: 15000.0
                  eventosRealizados: 50
      responses:
        '201':
          description: Artista creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artista'
              examples:
                ejemplo1:
                  summary: Artista pop creado
                  value:
                    id: 1
                    nombreArtistico: Aitana
                    nombreReal: Aitana Ocaña Morales
                    generoMusical: Pop
                    fechaNacimiento: '1999-06-27'
                    activo: true
                    cache: 5000.0
                    eventosRealizados: 20
                ejemplo2:
                  summary: Artista reggaeton creado
                  value:
                    id: 2
                    nombreArtistico: Bad Bunny
                    nombreReal: Benito Antonio Martinez
                    generoMusical: Reggaeton
                    fechaNacimiento: '1994-03-10'
                    activo: true
                    cache: 15000.0
                    eventosRealizados: 50
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /artistas/{id}:
    get:
      tags:
        - Artistas
      summary: Obtener artista por id
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Artista obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artista'
              examples:
