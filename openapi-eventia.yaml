openapi: 3.0.1
info:
  title: Eventia API
  description: API REST para la gestión de eventos, artistas, recintos, usuarios y reservas.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Servidor local
tags:
  - name: Usuarios
    description: Operaciones sobre usuarios
  - name: Artistas
    description: Operaciones sobre artistas
  - name: Recintos
    description: Operaciones sobre recintos
  - name: Eventos
    description: Operaciones sobre eventos
  - name: Reservas
    description: Operaciones sobre reservas
paths:
  /v1/usuarios:
    get:
      tags:
        - Usuarios
      summary: Obtener todos los usuarios (v1)
      description: Filtra opcionalmente por nombre, email y rol.
      parameters:
        - name: nombre
          in: query
          required: false
          description: Filtra por nombre del usuario.
          schema:
            type: string
          example: Lucia
        - name: email
          in: query
          required: false
          description: Filtra por email del usuario.
          schema:
            type: string
          example: lucia@gmail.com
        - name: rol
          in: query
          required: false
          description: Filtra por rol del usuario.
          schema:
            type: string
          example: ADMIN
      responses:
        '200':
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
              examples:
                sinFiltros:
                  summary: Consulta sin filtros
                  value:
                    - id: 1
                      nombre: Lucia
                      apellidos: Perez Gomez
                      email: lucia@gmail.com
                      password: secreto12
                      telefono: '600123123'
                      activo: true
                      fechaNacimiento: '1999-05-12'
                      eventosAsistidos: 4
                      rol: USER
                      saldoCuenta: 35.5
                    - id: 2
                      nombre: Carlos
                      apellidos: Lopez Martinez
                      email: carlos@gmail.com
                      password: clave5678
                      telefono: '611222333'
                      activo: true
                      fechaNacimiento: '1990-08-20'
                      eventosAsistidos: 10
                      rol: ADMIN
                      saldoCuenta: 120.0
                filtradoPorRol:
                  summary: Consulta filtrada por rol ADMIN
                  value:
                    - id: 2
                      nombre: Carlos
                      apellidos: Lopez Martinez
                      email: carlos@gmail.com
                      password: clave5678
                      telefono: '611222333'
                      activo: true
                      fechaNacimiento: '1990-08-20'
                      eventosAsistidos: 10
                      rol: ADMIN
                      saldoCuenta: 120.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Usuarios
      summary: Crear un usuario (v1)
      description: Registra un nuevo usuario en el sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
            examples:
              ejemplo1:
                summary: Usuario básico
                value:
                  nombre: Lucia
                  apellidos: Perez Gomez
                  email: lucia@gmail.com
                  password: secreto12
                  rol: USER
              ejemplo2:
                summary: Usuario completo
                value:
                  nombre: Carlos
                  apellidos: Lopez Martinez
                  email: carlos@gmail.com
                  password: clave5678
                  telefono: '611222333'
                  activo: true
                  fechaNacimiento: '1990-08-20'
                  eventosAsistidos: 0
                  rol: ADMIN
                  saldoCuenta: 50.0
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              examples:
                ejemplo1:
                  summary: Usuario básico creado
                  value:
                    id: 3
                    nombre: Lucia
                    apellidos: Perez Gomez
                    email: lucia@gmail.com
                    password: secreto12
                    activo: false
                    eventosAsistidos: 0
                    rol: USER
                    saldoCuenta: 0.0
                ejemplo2:
                  summary: Usuario completo creado
                  value:
                    id: 4
                    nombre: Carlos
                    apellidos: Lopez Martinez
                    email: carlos@gmail.com
                    password: clave5678
                    telefono: '611222333'
                    activo: true
                    fechaNacimiento: '1990-08-20'
                    eventosAsistidos: 0
                    rol: ADMIN
                    saldoCuenta: 50.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      deprecated: true
  /v2/usuarios:
    post:
      tags:
        - Usuarios
      summary: Crear un usuario (v2)
      description: Registra un nuevo usuario en el sistema. En la versión 2 el campo nickname es obligatorio.
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              $ref: '#/components/schemas/UsuarioV2'
            examples:
              ejemplo1:
                summary: Usuario básico v2
                value:
                  nombre: Lucia
                  apellidos: Perez Gomez
                  email: lucia_v2@gmail.com
                  password: secreto12
                  telefono: '600123123'
                  activo: true
                  fechaNacimiento: '1999-05-12'
                  eventosAsistidos: 0
                  rol: USER
                  saldoCuenta: 35.5
                  nickname: lucy
              ejemplo2:
                summary: Usuario administrador v2
                value:
                  nombre: Carlos
                  apellidos: Lopez Martinez
                  email: carlos_v2@gmail.com
                  password: clave5678
                  telefono: '611222333'
                  activo: true
                  fechaNacimiento: '1990-08-20'
                  eventosAsistidos: 10
                  rol: ADMIN
                  saldoCuenta: 120.0
                  nickname: carlosAdmin
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema: *id001
              examples:
                ejemplo1:
                  summary: Usuario v2 creado
                  value:
                    id: 3
                    nombre: Lucia
                    apellidos: Perez Gomez
                    email: lucia_v2@gmail.com
                    password: secreto12
                    telefono: '600123123'
                    activo: true
                    fechaNacimiento: '1999-05-12'
                    eventosAsistidos: 0
                    rol: USER
                    saldoCuenta: 35.5
                    nickname: lucy
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario por id (v1)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              examples:
                ejemplo1:
                  summary: Usuario con rol USER
                  value:
                    id: 1
                    nombre: Lucia
                    apellidos: Perez Gomez
                    email: lucia@gmail.com
                    password: secreto12
                    telefono: '600123123'
                    activo: true
                    fechaNacimiento: '1999-05-12'
                    eventosAsistidos: 4
                    rol: USER
                    saldoCuenta: 35.5
                ejemplo2:
                  summary: Usuario con rol ADMIN
                  value:
                    id: 2
                    nombre: Carlos
                    apellidos: Lopez Martinez
                    email: carlos@gmail.com
                    password: clave5678
                    telefono: '611222333'
                    activo: true
                    fechaNacimiento: '1990-08-20'
                    eventosAsistidos: 10
                    rol: ADMIN
                    saldoCuenta: 120.0
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      deprecated: true
    put:
      tags:
        - Usuarios
      summary: Modificar usuario (v1)
      description: Sustituye completamente los datos de un usuario existente.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
            examples:
              ejemplo1:
                summary: Cambio de rol
                value:
                  nombre: Lucia
                  apellidos: Perez Gomez
                  email: lucia@gmail.com
                  password: secreto12
                  telefono: '600123123'
                  activo: true
                  fechaNacimiento: '1999-05-12'
                  eventosAsistidos: 4
                  rol: ADMIN
                  saldoCuenta: 35.5
              ejemplo2:
                summary: Actualización de saldo
                value:
                  nombre: Carlos
                  apellidos: Lopez Martinez
                  email: carlos@gmail.com
                  password: clave5678
                  telefono: '611222333'
                  activo: true
                  fechaNacimiento: '1990-08-20'
                  eventosAsistidos: 11
                  rol: ADMIN
                  saldoCuenta: 200.0
      responses:
        '200':
          description: Usuario modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              examples:
                ejemplo1:
                  summary: Usuario con rol actualizado
                  value:
                    id: 1
                    nombre: Lucia
                    apellidos: Perez Gomez
                    email: lucia@gmail.com
                    password: secreto12
                    telefono: '600123123'
                    activo: true
                    fechaNacimiento: '1999-05-12'
                    eventosAsistidos: 4
                    rol: ADMIN
                    saldoCuenta: 35.5
                ejemplo2:
                  summary: Usuario con saldo actualizado
                  value:
                    id: 2
                    nombre: Carlos
                    apellidos: Lopez Martinez
                    email: carlos@gmail.com
                    password: clave5678
                    telefono: '611222333'
                    activo: true
                    fechaNacimiento: '1990-08-20'
                    eventosAsistidos: 11
                    rol: ADMIN
                    saldoCuenta: 200.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      deprecated: true
    patch:
      tags:
        - Usuarios
      summary: Modificar parcialmente un usuario
      description: Actualiza uno o varios campos de un usuario existente.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              ejemplo1:
                summary: Cambiar el rol
                value:
                  rol: ADMIN
              ejemplo2:
                summary: Desactivar usuario y poner saldo a cero
                value:
                  activo: false
                  saldoCuenta: 0.0
      responses:
        '200':
          description: Usuario actualizado parcialmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              examples:
                ejemplo1:
                  summary: Usuario con rol actualizado
                  value:
                    id: 1
                    nombre: Lucia
                    apellidos: Perez Gomez
                    email: lucia@gmail.com
                    password: secreto12
                    telefono: '600123123'
                    activo: true
                    fechaNacimiento: '1999-05-12'
                    eventosAsistidos: 4
                    rol: ADMIN
                    saldoCuenta: 35.5
                ejemplo2:
                  summary: Usuario desactivado
                  value:
                    id: 2
                    nombre: Carlos
                    apellidos: Lopez Martinez
                    email: carlos@gmail.com
                    password: clave5678
                    telefono: '611222333'
                    activo: false
                    fechaNacimiento: '1990-08-20'
                    eventosAsistidos: 10
                    rol: ADMIN
                    saldoCuenta: 0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario (v1)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Usuario eliminado correctamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      deprecated: true
  /v2/usuarios/{id}:
