components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Identificador único del recurso
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
  responses:
    BadRequest:
      description: Error de validación o petición incorrecta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 400
            title: bad-request
            message: Error de validación
            errors:
              email: El email no es válido
              password: La contraseña debe tener entre 6 y 20 caracteres
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 404
            title: not-found
            message: Recurso no encontrado
            errors: {}
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 500
            title: internal-server-error
            message: Error interno del servidor
            errors: {}
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 400
        title:
          type: string
          example: bad-request
        message:
          type: string
          example: Error de validación
        errors:
          type: object
          additionalProperties:
            type: string
      required:
        - code
        - title
        - message
        - errors
    UsuarioRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
      required:
        - id
    ArtistaRef:
