        '200':
          description: Artista modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artista'
              examples:
                ejemplo1:
                  summary: Artista actualizado
                  value:
                    id: 1
                    nombreArtistico: Aitana
                    nombreReal: Aitana Ocaña Morales
                    generoMusical: Pop latino
                    fechaNacimiento: '1999-06-27'
                    activo: true
                    cache: 8000.0
                    eventosRealizados: 25
                ejemplo2:
                  summary: Artista desactivado
                  value:
                    id: 2
                    nombreArtistico: Bad Bunny
                    nombreReal: Benito Antonio Martinez
                    generoMusical: Latin Trap
                    fechaNacimiento: '1994-03-10'
                    activo: false
                    cache: 15000.0
                    eventosRealizados: 50
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Artistas
      summary: Modificar parcialmente un artista
      description: Actualiza uno o varios campos de un artista existente.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              ejemplo1:
                summary: Cambiar género musical
                value:
                  generoMusical: Pop latino
              ejemplo2:
                summary: Desactivar artista
                value:
                  activo: false
      responses:
        '200':
          description: Artista actualizado parcialmente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artista'
              examples:
                ejemplo1:
                  summary: Género actualizado
                  value:
                    id: 1
                    nombreArtistico: Aitana
                    nombreReal: Aitana Ocaña Morales
                    generoMusical: Pop latino
                    fechaNacimiento: '1999-06-27'
                    activo: true
                    cache: 5000.0
                    eventosRealizados: 20
                ejemplo2:
                  summary: Artista desactivado
                  value:
                    id: 2
                    nombreArtistico: Bad Bunny
                    nombreReal: Benito Antonio Martinez
                    generoMusical: Reggaeton
                    fechaNacimiento: '1994-03-10'
                    activo: false
