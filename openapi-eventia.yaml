        password:
          type: string
          minLength: 6
          maxLength: 20
          example: secreto12
        telefono:
          type: string
          example: '600123123'
        activo:
          type: boolean
          example: true
        fechaNacimiento:
          type: string
          format: date
          example: '1999-05-12'
        eventosAsistidos:
          type: integer
          minimum: 0
          example: 4
        rol:
          type: string
