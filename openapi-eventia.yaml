    put:
      tags:
        - Artistas
      summary: Modificar artista
      description: Sustituye completamente los datos de un artista existente.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Artista'
            examples:
              ejemplo1:
                summary: Actualizar género y caché
                value:
                  nombreArtistico: Aitana
                  nombreReal: Aitana Ocaña Morales
                  generoMusical: Pop latino
                  fechaNacimiento: '1999-06-27'
                  activo: true
                  cache: 8000.0
                  eventosRealizados: 25
              ejemplo2:
                summary: Desactivar artista
                value:
                  nombreArtistico: Bad Bunny
                  nombreReal: Benito Antonio Martinez
                  generoMusical: Latin Trap
                  fechaNacimiento: '1994-03-10'
